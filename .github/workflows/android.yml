name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BEENBLOCK_KEYSTORE_PATH: ${{ github.workspace }}/beenblock-release.jks
      BEENBLOCK_KEYSTORE_PASSWORD: beenblock-ci
      BEENBLOCK_KEY_ALIAS: beenblock
      BEENBLOCK_KEY_PASSWORD: beenblock-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew || true

      - name: Generate CI signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$BEENBLOCK_KEYSTORE_PATH" \
            -storepass "$BEENBLOCK_KEYSTORE_PASSWORD" \
            -alias "$BEENBLOCK_KEY_ALIAS" \
            -keypass "$BEENBLOCK_KEY_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=BeenBlock CI, OU=CI, O=BeenBlock, L=CI, S=CI, C=US"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: BeenBlock-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
